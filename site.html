<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loomca - Download Aplikasi</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    background: linear-gradient(180deg, #f5f8fc 0%, #e8f1fb 100%);
    min-height: 100vh;
    display:flex; flex-direction:column; align-items:center;
    padding: 40px 20px;
  }
  .logo {
    width: 110px; height: 110px;
    background:#1e9bff;
    border-radius: 26px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 10px 25px rgba(30,155,255,0.35);
    margin-bottom: 18px;
  }
  .logo svg { width: 60px; height: 70px; }
  h1 { color:#1a1a2e; font-size: 26px; margin-bottom: 6px; }
  .dev { color:#8a8f98; font-size: 14px; margin-bottom: 18px; }
  .rating { color:#ffb400; font-size: 15px; margin-bottom: 4px; }
  .desc { color:#4b4f58; font-size: 14px; max-width: 480px; text-align:center; margin: 18px 0 28px; line-height:1.6; }
  .stats { display:flex; gap:36px; margin-bottom: 30px; }
  .stat { text-align:center; }
  .stat b { display:block; font-size:16px; color:#1a1a2e; }
  .stat span { font-size:12px; color:#8a8f98; }
  .btn {
    background:#1e9bff; color:#fff; border:none;
    padding: 16px 60px; font-size: 18px; font-weight:600;
    border-radius: 14px; cursor:pointer;
    box-shadow: 0 8px 18px rgba(30,155,255,0.4);
    transition: transform .15s;
  }
  .btn:active { transform: scale(0.96); }
  .progress-wrap {
    width: 280px; height: 10px; background:#dde7f2; border-radius: 10px;
    margin-top: 22px; overflow:hidden; display:none;
  }
  .progress-bar {
    height:100%; width:0%; background:#1e9bff; border-radius:10px;
    transition: width 2.2s linear;
  }
  .progress-label { margin-top:10px; font-size:13px; color:#8a8f98; display:none; }

  /* JUMPSCARE */
  #jumpscare {
    display:none;
    position:fixed; inset:0; background:#000;
    z-index:9999; align-items:center; justify-content:center;
    animation: flashRed 0.12s steps(1) infinite;
  }
  @keyframes flashRed {
    0% { background:#000; }
    50% { background:#7a0000; }
    100% { background:#000; }
  }
  #jumpscare img { width: 100%; height: 100%; object-fit: cover; }
  #jumpscare.show { display:flex; }
</style>
</head>
<body>

  <div class="logo">
    <svg viewBox="0 0 512 512" fill="white">
      <path d="M200 60 L280 70 L245 300 L390 290 L400 400 L165 460 L120 320 Z"/>
    </svg>
  </div>

  <h1>Loomca</h1>
  <div class="dev">by Loomca Studio</div>
  <div class="rating">★★★★★ 4.8 &nbsp;|&nbsp; 10 JT+ Download</div>

  <div class="desc">
    Loomca — aplikasi belajar Ringan, cepat, dan gratis. Yuk install sekarang!
  </div>

  <div class="stats">
    <div class="stat"><b>52 MB</b><span>Ukuran</span></div>
    <div class="stat"><b>Everyone</b><span>Rating Usia</span></div>
    <div class="stat"><b>v3.2.1</b><span>Versi</span></div>
  </div>

  <button class="btn" id="dlBtn" onclick="startDownload()">Install</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="progress-label" id="progressLabel">Mengunduh...</div>

  <div id="jumpscare">
    <img src="https://i.ytimg.com/vi/RNoHcWE8tbQ/maxresdefault.jpg" alt="jumpscare">
  </div>

  <audio id="jumpscareAudio" src="https://www.myinstants.com/media/sounds/jumpscare-sound.mp3" preload="auto"></audio>

<script>
function playScream() {
  const audio = document.getElementById('jumpscareAudio');
  audio.currentTime = 0;
  audio.volume = 1;
  audio.play().catch(() => {});
}

function startDownload() {
  document.getElementById('dlBtn').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('progressLabel').style.display = 'block';
  const bar = document.getElementById('progressBar');
  requestAnimationFrame(() => { bar.style.width = '100%'; });

  setTimeout(() => {
    const js = document.getElementById('jumpscare');
    js.classList.add('show');
    playScream();
    if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);

    setTimeout(() => {
      js.classList.remove('show');
      document.getElementById('progressLabel').textContent = 'Wkwkwk kena prank 😂';
    }, 2200);
  }, 2300);
}
</script>

</body>
</html>
